<!DOCTYPE html>
<html>
<head>
    <title>My First Business Website</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f1eb;
        text-align: center;
        margin: 0;
        padding-top: 120px;
    }

    h1 {
        font-size: 55px;
        color: #222;
        margin-bottom: 20px;
    }

    p {
        font-size: 20px;
        color: #555;
        margin-bottom: 30px;
    }

    button {
        padding: 15px 30px;
        font-size: 18px;
        background-color: #222;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }

    button:hover {
        background-color: #555;
    }
</style>
</head>

<body>

    <h1>Welcome to My Business</h1>

    <p>We provide amazing services for our customers.</p>

    <button>Contact Us</button>

</body>
</html>
